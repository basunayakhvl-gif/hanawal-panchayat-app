<!doctype html><html lang="kn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ಗ್ರಾಮ ಪಂಚಾಯತ್ ಹಣವಾಳ</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#172033}header{background:#075b3b;color:white;padding:18px}.wrap{max-width:1050px;margin:auto;padding:16px}.logo{width:70px;height:70px;object-fit:cover;border-radius:10px;vertical-align:middle;margin-right:12px}.btn{background:#075b3b;color:#fff;border:0;padding:10px 14px;border-radius:8px;cursor:pointer}input,select{padding:10px;border:1px solid #ccd3dd;border-radius:7px;width:100%;box-sizing:border-box;margin:5px 0 12px}.panel{background:white;padding:18px;border-radius:12px;margin:15px 0;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.hidden{display:none}.error{color:#b42318}</style></head><body><header><div class="wrap"><img class="logo" src="hanawal_panchayat.jpg"><b>ಗ್ರಾಮ ಪಂಚಾಯತ್ ಹಣವಾಳ</b><div>ತಾಲೂಕು: ಗಂಗಾವತಿ • ಜಿಲ್ಲೆ: ಕೊಪ್ಪಳ • 📞 8073801416</div></div></header><main class="wrap"><button class="btn" onclick="pub()">Public Documents</button> <button class="btn" onclick="adm()">Admin</button><section id="public"><div class="panel"><h2>ಸಾರ್ವಜನಿಕ ದಾಖಲೆಗಳು</h2><div class="grid"><input id="q" placeholder="Motion No. / ವಿಷಯ"><input id="date" type="date"><select id="status"><option value="">ಎಲ್ಲಾ Status</option><option>Approved</option><option>Pending</option><option>Rejected</option></select></div><div id="list">Loading...</div></div></section><section id="admin" class="hidden"><div id="login" class="panel"><h2>Admin Login</h2><input id="password" type="password" placeholder="Admin password"><button class="btn" onclick="login()">Login</button><p id="err" class="error"></p></div><div id="dashboard" class="panel hidden"><h2>PDF / Scan Upload</h2><form id="form"><input name="no" placeholder="Motion No." required><input name="date" type="date" required><input name="subject" placeholder="ವಿಷಯ" required><select name="status"><option>Approved</option><option>Pending</option><option>Rejected</option></select><input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png" required><button class="btn">Upload</button></form><p id="upmsg"></p><div id="adminList"></div></div></section></main><script>
let token=sessionStorage.getItem("hanawalToken")||"";
async function api(fn,opt={}){opt.headers=opt.headers||{};if(token)opt.headers.Authorization="Bearer "+token;let r=await fetch("/.netlify/functions/"+fn,opt);let t=await r.text();let d;try{d=JSON.parse(t)}catch(e){throw Error("Netlify Function response error: "+r.status)}if(!r.ok)throw Error(d.error||"Request failed");return d}
function pub(){document.getElementById("public").classList.remove("hidden");document.getElementById("admin").classList.add("hidden");load()}
function adm(){document.getElementById("public").classList.add("hidden");document.getElementById("admin").classList.remove("hidden")}
async function login(){try{let d=await api("login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:password.value})});token=d.token;sessionStorage.setItem("hanawalToken",token);loginBox()}catch(e){err.textContent=e.message}}
function loginBox(){document.getElementById("login").classList.add("hidden");document.getElementById("dashboard").classList.remove("hidden");adminLoad()}
form.onsubmit=async e=>{e.preventDefault();try{await api("upload",{method:"POST",body:new FormData(form)});upmsg.textContent="Upload ಯಶಸ್ವಿಯಾಗಿದೆ";form.reset();load();adminLoad()}catch(x){upmsg.textContent=x.message}}
async function load(){try{let a=(await api("documents")).documents;let q=document.getElementById("q").value.toLowerCase(),dt=document.getElementById("date").value,st=document.getElementById("status").value;a=a.filter(x=>(x.no+" "+x.subject).toLowerCase().includes(q)&&(!dt||x.date===dt)&&(!st||x.status===st));list.innerHTML="<table><tr><th>Motion</th><th>ದಿನಾಂಕ</th><th>ವಿಷಯ</th><th>Status</th><th>Document</th></tr>"+a.map(x=>`<tr><td>${esc(x.no)}</td><td>${esc(x.date)}</td><td>${esc(x.subject)}</td><td>${esc(x.status)}</td><td><a href="${x.shareUrl}" target="_blank">View</a></td></tr>`).join("")+"</table>"}catch(e){list.textContent=e.message}}
async function adminLoad(){try{let a=(await api("documents?admin=1")).documents;adminList.innerHTML=a.map(x=>`<p><b>${esc(x.no)}</b> ${esc(x.subject)} — <a href="${x.shareUrl}" target="_blank">View</a> <button onclick="del('${x.id}')">Delete</button></p>`).join("")}catch(e){adminList.textContent=e.message}}
async function del(id){if(confirm("Delete?")){await api("delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});load();adminLoad()}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
q.oninput=load;date.onchange=load;status.onchange=load;load();
</script></body></html>
