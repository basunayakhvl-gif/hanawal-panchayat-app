```html
<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hanawal Gram Panchayat</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1769aa;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #1769aa;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .danger {
      background: #c62828;
    }

    .hidden {
      display: none;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .menu button {
      margin: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: white;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #eee;
    }

    .error {
      color: #c62828;
      font-weight: bold;
    }

    .success {
      color: #2e7d32;
      font-weight: bold;
    }

    a {
      color: #1769aa;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>ಹನಾವಳ ಗ್ರಾಮ ಪಂಚಾಯತ್</h1>
  <p>Online Panchayat Administration</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <section id="login" class="card">
    <h2>Admin Login</h2>

    <label>Username</label>
    <input id="username" type="text" placeholder="Username" autocomplete="username">

    <label>Password</label>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">

    <button onclick="login()">Login</button>

    <p id="err" class="error"></p>
  </section>


  <!-- ADMIN DASHBOARD -->
  <section id="dashboard" class="hidden">

    <div class="card">
      <h2>Admin Dashboard</h2>

      <div class="menu">
        <button onclick="showSection('documentsSection')">
          Documents
        </button>

        <button onclick="showSection('mutationSection')">
          Mutation
        </button>

        <button onclick="showSection('uploadSection')">
          Upload Document
        </button>

        <button onclick="showSection('manageSection'); adminLoad()">
          Manage Documents
        </button>

        <button class="danger" onclick="logout()">
          Logout
        </button>
      </div>
    </div>


    <!-- DOCUMENTS -->
    <section id="documentsSection" class="card">

      <h2>Documents</h2>

      <input id="q" type="text" placeholder="Search document..." oninput="load()">

      <input id="date" type="date" onchange="load()">

      <select id="status" onchange="load()">
        <option value="">All Status</option>
        <option value="Pending">Pending</option>
        <option value="Approved">Approved</option>
        <option value="Rejected">Rejected</option>
      </select>

      <div id="list">
        Loading...
      </div>

    </section>


    <!-- MUTATION -->
    <section id="mutationSection" class="card hidden">

      <h2>Mutation</h2>

      <p>
        Mutation application/upload page
      </p>

      <a href="Mutation.html">
        <button type="button">Open Mutation App</button>
      </a>

    </section>


    <!-- UPLOAD -->
    <section id="uploadSection" class="card hidden">

      <h2>Upload Document</h2>

      <form id="uploadForm">

        <label>Document Number</label>
        <input name="no" type="text" required>

        <label>Date</label>
        <input name="date" type="date" required>

        <label>Subject</label>
        <input name="subject" type="text" required>

        <label>Status</label>
        <select name="status">
          <option value="Pending">Pending</option>
          <option value="Approved">Approved</option>
          <option value="Rejected">Rejected</option>
        </select>

        <label>Select Document</label>
        <input name="file" type="file" required>

        <button type="submit">
          Upload Document
        </button>

      </form>

      <p id="upmsg"></p>

    </section>


    <!-- MANAGE DOCUMENTS -->
    <section id="manageSection" class="card hidden">

      <h2>Manage Documents</h2>

      <div id="adminList">
        Loading...
      </div>

    </section>

  </section>

</div>


<script>

let token = sessionStorage.getItem("hanawalToken") || "";


/* API */
async function api(fn, opt = {}) {

  opt.headers = opt.headers || {};

  if (token) {
    opt.headers.Authorization = "Bearer " + token;
  }

  const response =
    await fetch("/.netlify/functions/" + fn, opt);

  const text = await response.text();

  let data;

  try {
    data = JSON.parse(text);
  } catch (e) {
    throw new Error(
      "Netlify Function response error: " +
      response.status
    );
  }

  if (!response.ok) {
    throw new Error(
      data.error || "Request failed"
    );
  }

  return data;
}


/* LOGIN */
async function login() {

  const user =
    document.getElementById("username").value.trim();

  const pass =
    document.getElementById("password").value;

  const err =
    document.getElementById("err");

  err.textContent = "";

  if (!user || !pass) {
    err.textContent =
      "Username ಮತ್ತು Password ನಮೂದಿಸಿ";
    return;
  }

  try {

    const data = await api("login", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        username: user,
        password: pass
      })
    });

    token = data.token;

    sessionStorage.setItem(
      "hanawalToken",
      token
    );

    loginBox();

  } catch (e) {

    err.textContent = e.message;
  }
}


/* SHOW DASHBOARD */
function loginBox() {

  document
    .getElementById("login")
    .classList.add("hidden");

  document
    .getElementById("dashboard")
    .classList.remove("hidden");

  load();
}


/* SECTION NAVIGATION */
function showSection(id) {

  const sections = [
    "documentsSection",
    "mutationSection",
    "uploadSection",
    "manageSection"
  ];

  sections.forEach(section => {

    document
      .getElementById(section)
      .classList.add("hidden");

  });

  document
    .getElementById(id)
    .classList.remove("hidden");
}


/* UPLOAD */
document
  .getElementById("uploadForm")
  .onsubmit = async function(e) {

    e.preventDefault();

    const msg =
      document.getElementById("upmsg");

    msg.className = "";
    msg.textContent = "Uploading...";

    try {

      await api("upload", {
        method: "POST",
        body: new FormData(this)
      });

      msg.className = "success";
      msg.textContent =
        "Upload ಯಶಸ್ವಿಯಾಗಿದೆ";

      this.reset();

      load();
      adminLoad();

    } catch (e) {

      msg.className = "error";
      msg.textContent = e.message;
    }
  };


/* LOAD DOCUMENTS */
async function load() {

  const list =
    document.getElementById("list");

  try {

    const data =
      await api("documents");

    let documents =
      data.documents || [];

    const search =
      document
        .getElementById("q")
        .value
        .toLowerCase();

    const selectedDate =
      document
        .getElementById("date")
        .value;

    const selectedStatus =
      document
        .getElementById("status")
        .value;

    documents =
      documents.filter(x => {

        const text =
          (x.no + " " + x.subject)
          .toLowerCase();

        return (
          text.includes(search) &&
          (!selectedDate ||
            x.date === selectedDate) &&
          (!selectedStatus ||
            x.status === selectedStatus)
        );

      });


    if (!documents.length) {

      list.innerHTML =
        "<p>No documents found.</p>";

      return;
    }


    let html = `
      <table>
        <tr>
          <th>No</th>
          <th>Date</th>
          <th>Subject</th>
          <th>Status</th>
          <th>Document</th>
        </tr>
    `;


    documents.forEach(x => {

      html += `
        <tr>
          <td>${esc(x.no)}</td>
          <td>${esc(x.date)}</td>
          <td>${esc(x.subject)}</td>
          <td>${esc(x.status)}</td>
          <td>
            <a
              href="${x.shareUrl}"
              target="_blank">
              View
            </a>
          </td>
        </tr>
      `;

    });


    html += "</table>";

    list.innerHTML = html;

  } catch (e) {

    list.innerHTML =
      `<p class="error">${esc(e.message)}</p>`;
  }
}


/* ADMIN DOCUMENT MANAGEMENT */
async function adminLoad() {

  const adminList =
    document.getElementById("adminList");

  try {

    const data =
      await api("documents?admin=1");

    const documents =
      data.documents || [];

    if (!documents.length) {

      adminList.innerHTML =
        "<p>No documents found.</p>";

      return;
    }


    adminList.innerHTML =
      documents.map(x => `

        <div class="card">

          <b>${esc(x.no)}</b>

          <br>

          ${esc(x.subject)}

          <br>

          <a
            href="${x.shareUrl}"
            target="_blank">
            View
          </a>

          <button
            class="danger"
            onclick="del('${esc(x.id)}')">
            Delete
          </button>

        </div>

      `).join("");

  } catch (e) {

    adminList.innerHTML =
      `<p class="error">${esc(e.message)}</p>`;
  }
}


/* DELETE */
async function del(id) {

  if (!confirm("ಈ document ಅನ್ನು delete ಮಾಡಬೇಕೇ?")) {
    return;
  }

  try {

    await api("delete", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        id: id
      })
    });

    alert("Document deleted");

    load();
    adminLoad();

  } catch (e) {

    alert(e.message);
  }
}


/* LOGOUT */
function logout() {

  sessionStorage.removeItem(
    "hanawalToken"
  );

  token = "";

  document
    .getElementById("dashboard")
    .classList.add("hidden");

  document
    .getElementById("login")
    .classList.remove("hidden");

  document
    .getElementById("username")
    .value = "";

  document
    .getElementById("password")
    .value = "";

  showSection("documentsSection");
}


/* ESCAPE HTML */
function esc(value) {

  return String(value ?? "")
    .replace(/[&<>"']/g, function(c) {

      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[c];

    });
}


/* EXISTING LOGIN SESSION */
if (token) {

  loginBox();

}

</script>

</body>
</html>
